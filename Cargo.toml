[package]
exclude = ["*.jpg"]
name = "simdnoise"
version = "4.0.0"
authors = [
    "Jack Mott <jack.mott@gmail.com>",
    "Peter Reijnders <peter.reijnders@verpeteren.nl>",
]
description = "SIMD accelerate noise library with runtime feature detection"
license = "Apache-2.0/MIT"
documentation = "https://docs.rs/simdnoise/"
readme = "README.md"
keywords = ["SIMD", "noise", "simplex", "perlin", "performance"]
repository = "https://github.com/verpeteren/rust-simd-noise"
categories = ["game-engines", "multimedia::images"]
edition = "2018"

[features]
default = []
# Force the scalar backend for the whole public API (no CPU SIMD executed).
# Enable it for toolchains that can't compile/run the vendor SIMD intrinsics,
# e.g. the Cranelift rustc backend for fast hot-reloaded debug builds. See the
# crate-level docs for the compile-warning caveat.
scalar = []

[dependencies]
simdeez = "3.0.1"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "benchmarks"
harness = false

[workspace]
members = ["example"]
